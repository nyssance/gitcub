# 门禁。两件事：
#   1. 主平台（macOS）直接执行检查命令；Fabric 仅用于本地开发。
#   2. Windows / Linux 至少**编译一遍** —— 那两个平台的 cfg 分支在开发机上
#      连语法都没被检查过（`#[cfg(windows)]` 的窗口效果就是这种），
#      这一格是它们唯一的保障
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支上新的推送让旧的跑作废，不排队白烧
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: 全套（macOS）
    # ARM hosted runner capacity prevented the previous macOS job from starting.
    # Keep the full native gate on macOS; local Hasgard acceptance also covers ARM.
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - name: 安装原生 E2E 驱动
        run: cargo install tauri-hasgard-cli --version "^0.6" --locked
      - name: 类型检查
        run: bun check --no-script -p tsconfig.json && bun check --no-script -p tsconfig.tools.json
      - name: Storybook 浏览器
        run: bunx --bun playwright install chromium
      - name: 自定义组件预览与交互
        run: bun run storybook:test
      - name: 上游清单与同步工具测试
        run: python -m unittest discover -s tests -p 'test_desktop_catalog.py' -v && python -m unittest discover -s tests -p 'test_vendor.py' -v
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
        working-directory: src-tauri
      - name: Rust 编译检查
        run: cargo check --locked --workspace --all-targets
        working-directory: src-tauri
      - name: Hasgard 编译检查
        run: cargo check --locked --workspace --all-targets --all-features
        working-directory: src-tauri
      - name: 上游行为测试
        run: bun run test:upstream
      - name: Rust 测试
        run: cargo test --locked --workspace
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-e2e
          path: |
            test-results/desktop-e2e
            test-results/macos-workflows
            test-results/storybook
            test-results/storybook-report
          if-no-files-found: ignore

  cross:
    name: 编译（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      # Tauri 在 Linux 上靠系统的 webkit2gtk；没有这些连 cargo check 都过不去
      - name: 系统依赖（Linux）
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      # --all-targets 连测试代码一起编，这样平台相关的测试也不会漏
      - name: 编译
        run: cargo check --locked --workspace --all-targets --all-features
        working-directory: src-tauri
      - name: Windows 本地 Desktop 导入回归
        if: matrix.os == 'windows-latest'
        working-directory: src-tauri
        run: |
          cargo test --locked --bin gitcub credentials
          cargo test --locked --bin gitcub desktop_import
          cargo test --locked --bin gitcub windows_integrations
          cargo test --locked --bin gitcub migration_tests
